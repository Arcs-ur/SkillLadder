[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skillladder"
version = "1.0.0"
description = "Multi-user skill evolution with compliance-oriented synchronization and quality-gated synthesis"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
authors = [
  {name = "Nan Chen"},
  {name = "Yi Wang"},
  {name = "Bin Benjamin Zhu"},
  {name = "Haoyi Xiong"},
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.24",
  "openai>=1.30",
  "pydantic>=2.0",
  "PyYAML>=6.0.2",
  "scikit-learn>=1.3",
  "sentence-transformers>=2.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.urls]
Repository = "https://github.com/Arcs-ur/SkillLadder"
Paper = "https://aclanthology.org/2026.findings-emnlp.218/"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
